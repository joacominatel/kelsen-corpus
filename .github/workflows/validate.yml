name: admission

on: pull_request

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Test the validator
        run: uv run --project validator --locked pytest validator/tests
      - name: Validate the store
        env:
          VISIBILITY_FLAG: ${{ github.event.repository.private == false && '--public' || '' }}
        run: uv run --project validator --locked kc-validate $VISIBILITY_FLAG .

  bm-noop:
    name: bm-noop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Index entries with Basic Memory
        env:
          BASIC_MEMORY_CONFIG_DIR: ${{ runner.temp }}/basic-memory
        run: |
          uv tool install --python 3.12 basic-memory==0.24.1
          bm project add corpus "$PWD/entries" --no-wait
          bm reindex --search -p corpus
      - name: Require an untouched working tree
        run: |
          git status --porcelain
          git diff
          test -z "$(git status --porcelain)"
